name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # tools/knowledge_store.py's system tests need a real Postgres+pgvector instance and skip
    # without one (mirroring control-plane's own durability-test convention) - running them
    # against a service container here, rather than letting them skip silently in CI forever, is
    # the whole point of that convention. Port/credentials match
    # tests/fixtures/db_credentials_sample/local.conn exactly, so the same fixture file used
    # locally works here unchanged.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cobol_modernizer
          POSTGRES_USER: cobol_modernizer
          POSTGRES_PASSWORD: cobol_modernizer_dev_only
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U cobol_modernizer -d cobol_modernizer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Run tests with coverage
        # Floor matches agentic-sdlc-control-plane's convention: set at what a real run
        # produces, so it can only ratchet up, never silently regress.
        run: pytest --cov=cobol_modernizer --cov-report=term-missing --cov-fail-under=90

      - name: Assert every mermaid diagram parses
        # Reused from control-plane, where this has caught a real defect three times -
        # see scripts/validate-mermaid.mjs for the history.
        run: |
          npm install --no-fund --no-audit --no-save mermaid jsdom
          node scripts/validate-mermaid.mjs

      - name: Assert no tenant vocabulary is silently treated as trusted instructions
        # This repo is the *inverse* of control-plane's domain-agnostic rule (ADR-0001's
        # design agent note): it is expected to carry COBOL/CardDemo vocabulary. What must
        # never happen instead is COBOL source text being read as instructions rather than
        # data — see .claude/agents/development.md. No enforcement exists yet because no
        # node reads COBOL source yet (Milestone C1); this step is a placeholder that fails
        # loudly once nodes.spec_extractor exists without a corresponding guardrail test.
        run: |
          if [ -f src/cobol_modernizer/nodes/spec_extractor.py ] && [ ! -f tests/system/test_guardrails.py ]; then
            echo "::error::spec_extractor exists with no guardrail test covering it"
            exit 1
          fi
          echo "no extraction node yet, or guardrail test present"
