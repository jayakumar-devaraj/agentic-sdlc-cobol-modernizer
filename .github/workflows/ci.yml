name: ci

# WHY THERE IS NO `push: branches: [main]` TRIGGER.
#
# There was, and it doubled this repository's bill for nothing. This is the expensive repository -
# a full run is 10-12 minutes against control-plane's 4 - and every `pull_request` run was followed
# by a `push main` run of the same length, because merging is what produced the push. GitHub runs
# pull-request checks against the MERGE RESULT rather than the branch tip, so the tree that lands
# on `main` is the tree the PR just tested. Re-testing it is paying twice for one answer.
#
# **The gap that leaves, stated rather than hidden:** the merge result is only the merged tree if
# `main` has not moved between the check and the merge. Enable branch protection's *"Require
# branches to be up to date before merging"* to close it. This repository merges one PR at a time
# (CLAUDE.md's branching workflow), so the window is already narrow, but a settings toggle is a
# better guarantee than a habit.
#
# `workflow_dispatch` is the escape hatch: run this on `main` by hand when that is actually wanted,
# instead of on every merge forever.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per pull request. A second push to the same branch cancels the run the first one started
# rather than paying for both - `fix/corpus-reachability` ran three full 12-minute builds this way,
# two of which nobody was ever going to read.
#
# The key falls back to `run_id` off a pull request, which is unique per run, so a manual
# `workflow_dispatch` is never cancelled by the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # tools/knowledge_store.py's system tests need a real Postgres+pgvector instance and skip
    # without one (mirroring control-plane's own durability-test convention) - running them
    # against a service container here, rather than letting them skip silently in CI forever, is
    # the whole point of that convention. Port/credentials match
    # tests/fixtures/db_credentials_sample/local.conn exactly, so the same fixture file used
    # locally works here unchanged.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cobol_modernizer
          POSTGRES_USER: cobol_modernizer
          POSTGRES_PASSWORD: cobol_modernizer_dev_only
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U cobol_modernizer -d cobol_modernizer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # This caches the `uv` wheel that the lock step installs, and nothing else: the project's
          # own dependencies now come from `uv sync` against `uv.lock`, which brings its own cache.
          # (It previously cached langgraph, anthropic, psycopg and the OpenTelemetry packages,
          # which is no longer what pip installs here.)
          cache: pip
          cache-dependency-path: pyproject.toml

      # `tools/local_compiler.py` drives a real Maven build, and its tests run one. Giving this job
      # a JDK is what keeps them from skipping here forever -- the same reasoning `template-build`
      # already applies to Docker: a test that skips in CI is decoration, not a gate. The version
      # matches the template's pin, since the thing under test is that project's build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # `uv lock --check` asserts the lockfile would not change if regenerated here. That is a
      # stronger statement than "the file exists": this repository's lock is generated on Windows,
      # and a lock that resolved to one platform's packages would fail on this Linux runner --
      # `colorama` and `tzdata` are in it carrying `sys_platform == 'win32'` markers, which is the
      # shape that survives both. The same command has to produce the same bytes anywhere.
      #
      # `pip install uv` rather than `astral-sh/setup-uv`: every other action here is first-party
      # `actions/*`, and a one-line check is not worth changing that posture for.
      #
      - name: Assert the lockfile matches pyproject.toml
        run: |
          pip install uv
          uv lock --check

      # `uv sync`, not `pip install -e ".[dev]"`. The floors in `pyproject.toml` resolve to whatever
      # is newest on the day the job runs, so a release of any of the 71 packages could turn an
      # unrelated pull request red -- the exposure the lock exists to close. Installing from the
      # lock is what actually closes it; checking the lock without installing from it only proves
      # the file is current.
      #
      # `--frozen` so the install can never silently re-resolve: if the lock and `pyproject.toml`
      # disagree, this fails rather than quietly installing something the lock does not describe.
      # The step above already reports that disagreement with a clearer message.
      #
      # Adding `.venv/bin` to `PATH` rather than prefixing every later step with `uv run` keeps
      # `ruff`, `mypy` and `pytest` written exactly as they are run locally.
      - name: Install dependencies from the lockfile
        run: |
          uv sync --extra dev --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: ruff check src/ tests/

      # A step in `test`, deliberately, rather than a job of its own. The branch ruleset requires
      # exactly one context -- `test` -- so a separate `types` job would report green and gate
      # nothing until the ruleset was edited too, and a job rename is what leaves protection
      # waiting on a context nothing reports.
      #
      # Bare `mypy`: the files to check are `[tool.mypy] files` in pyproject.toml, so the command
      # and a local run cannot disagree about scope.
      #
      # This gate is what `src/cobol_modernizer/py.typed` claims. The marker tells a consumer's
      # type checker that these annotations are meaningful; without something enforcing that on
      # every PR the claim decays on the first unchecked merge. See ADR-0061.
      - name: Type-check
        run: mypy

      - name: Run tests with coverage
        # Floor matches agentic-sdlc-control-plane's convention: set at what a real run
        # produces, so it can only ratchet up, never silently regress.
        run: pytest --cov=cobol_modernizer --cov-report=term-missing --cov-fail-under=90

      - name: Assert every mermaid diagram parses
        # Reused from control-plane, where this has caught a real defect three times -
        # see scripts/validate-mermaid.mjs for the history.
        run: |
          npm install --no-fund --no-audit --no-save mermaid jsdom
          node scripts/validate-mermaid.mjs

      - name: Assert no tenant text reaches a model outside the untrusted block
        # This repo is the *inverse* of control-plane's domain-agnostic rule (ADR-0001's
        # design agent note): it is expected to carry COBOL/CardDemo vocabulary. What must
        # never happen instead is COBOL source text being read as instructions rather than
        # data — see .claude/agents/development.md.
        #
        # This step used to check only that tests/system/test_guardrails.py *existed* if
        # spec_extractor.py did, and its comment still said no node read COBOL source. Four do.
        # It now runs the boundary section of that module, which asserts the real property
        # against the prompt each node actually sends — captured through the node's own injected
        # model callback — and fails if a single tenant comment line lands outside the wrapped
        # block. ADR-0052 records why a behavioural check rather than an import-level one.
        #
        # Six prompts since ADR-0056, not four: build_validator and the engineer's repair prompt
        # both quoted model-authored Java back undelimited, and that Java is a model's account of
        # the tenant COBOL the engineer wraps.
        #
        # Deliberately run again after the full suite above: a boundary regression should be a
        # distinctly named red, not one line among eleven hundred. It costs under a second.
        run: pytest tests/system/test_guardrails.py -q

  # Compiles and tests src/cobol_modernizer/data/templates/target-spring-boot-baseline on the exact JDK it pins.
  # ADR-0034 makes this a gate rather than an intention: the Java 25 risk is not the language but
  # the ecosystem's bytecode tooling (Hibernate/ByteBuddy, Mockito's instrumentation agent,
  # Testcontainers), which fails at *runtime*. Running it here means an unsupported transitive
  # dependency surfaces at step 38 instead of inside the self-healing compile loop at step 42,
  # where the loop would be diagnosing a dependency problem it was never built to fix.
  # Docker is available on this runner, which BaselineStackTest needs - it deliberately does not
  # skip without it.
  template-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialised behind `test` purely to stop paying for it when `test` has already failed. It
    # costs the same minutes on a green run - the two jobs' times simply add either way - and saves
    # all of them on a red one, which is the common case while a branch is being iterated. The
    # price is wall-clock: a passing run now takes test-then-build rather than both at once.
    # control-plane's workflow already gates its two downstream jobs this way.
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # `./mvnw`, not `mvn`. The runner image ships some Maven, and which one is not this repo's
      # decision to inherit: the wrapper pins the version in `.mvn/wrapper/maven-wrapper.properties`
      # so CI and a developer's machine resolve the same build tool. Everything else in this
      # template is pinned deliberately -- the JDK, Spring Boot, Testcontainers, and a test that
      # asserts the JDK's own feature version -- and the build tool was the one thing left free to
      # drift under an image update.
      - name: Report the resolved toolchain
        working-directory: src/cobol_modernizer/data/templates/target-spring-boot-baseline
        run: java -version && ./mvnw -B -ntp -version

      - name: Build and test the target baseline template
        working-directory: src/cobol_modernizer/data/templates/target-spring-boot-baseline
        run: ./mvnw -B -ntp verify
