[project]
name = "cobol-modernizer"
version = "0.1.0"
description = "COBOL-to-Java modernization specialist, invoked as a CLI by agentic-sdlc-control-plane."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.9",
    "pydantic>=2.10.4",
    "anthropic>=0.40.0",
]

[project.scripts]
cobol-modernizer = "cobol_modernizer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
