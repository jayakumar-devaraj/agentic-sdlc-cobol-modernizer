[project]
name = "cobol-modernizer"
version = "0.1.2"
description = "COBOL-to-Java modernization specialist, invoked as a CLI by agentic-sdlc-control-plane."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.9",
    "pydantic>=2.10.4",
    "anthropic>=0.40.0",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "pyyaml>=6.0.2",
    # ADR-0046's tracing. Runtime dependencies rather than an extra, deliberately: this repo is
    # installed by control-plane as a pinned requirement string (its `config/
    # scenario_specialists.yaml`), which names no extras, so an extra would mean the deployment
    # that most needs tracing is the one guaranteed not to have it. The cost against ADR-0001's
    # bounded-subprocess premise is bounded in turn - `telemetry/tracing.py` imports them lazily
    # and constructs nothing unless an OTEL endpoint is configured.
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
]

[project.scripts]
cobol-modernizer = "cobol_modernizer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    # `core/model_catalog.py` and `core/model_routing.py` both `import yaml`. Without the stubs
    # mypy reports `import-untyped` on each and then treats every value read out of the model
    # catalog as `Any`, which silently disables checking across the routing path -- the two
    # modules where a wrong type would pick the wrong model.
    "types-PyYAML>=6.0.12",
    # Required by tests/system/test_packaging.py, which builds a real wheel. Listed here rather
    # than left to chance: that test skips when `build` is absent, and a guard that silently skips
    # is the decorative-check failure Open Issue 3 already cost this repo once.
    "build>=1.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The CLI's own data: prompt registry, model catalog/routing config, and the Spring Boot baseline
# copied into every generated project (ADR-0055).
#
# **This block is redundant today, and is kept deliberately.** What actually puts these files in the
# wheel is that they now live *inside* the package: setuptools defaults `include_package_data` to
# true for pyproject-configured projects, so `src/cobol_modernizer/data/**` is picked up with or
# without the globs below. Measured, not assumed -- deleting the `data/templates` line changes
# nothing, and only `include-package-data = false` *together with* deleting it drops the 40 template
# files. The globs stay because relying on an implicit default for the thing that makes an install
# work is how this defect happened in the first place; a future setuptools that flips that default
# should not silently produce an empty wheel again.
#
# One consequence worth knowing before "simplifying" this: a damage probe that deletes a line here
# cannot fail. `tests/system/test_packaging.py` still guards the property that matters -- the files
# are in the wheel and an installed copy can read them -- by inspecting the built artifact.
#
# `schemas/` is deliberately absent: nothing in the runtime path reads it -- only
# `scripts/generate_schemas.py` and `tests/system/test_schemas.py` do.
[tool.setuptools.package-data]
cobol_modernizer = [
    "data/prompts/registry/**/*.md",
    "data/config/*.yaml",
    "data/templates/**/*",
    # `**/*` does not descend into a dot-directory, so the line above misses the Maven wrapper's
    # `.mvn/wrapper/maven-wrapper.properties` -- which `mvnw` reads to learn which Maven
    # distribution to fetch. Every wheel this repo built before ADR-0058 was missing it, and
    # `./mvnw` in an installed baseline exited 1 with "Cannot start maven from wrapper" before
    # Maven ever started. `local_compiler` prefers `./mvnw` over `mvn`, so that is the build path.
    "data/templates/**/.mvn/wrapper/*",
]

# `include_package_data` collects what is on disk and `.gitignore` has no say in it: a developer
# who has run the Java baseline's build once has 26 files of `target/` output -- compiled
# `.class` files, a `.jar`, `maven-status/*.lst` -- sitting inside the package data directory,
# every one of them eligible to be shipped as a baseline source.
#
# **This exclusion only works together with a regenerated `src/*.egg-info`**, and that pairing was
# established by running the 2x2 rather than by reading the docs. With a stale `SOURCES.txt` the
# manifest path reintroduces all 26 files and this table has no effect; with a fresh one and this
# table removed, all 26 come back. Both levers are required, so the wheel fixture in
# `tests/system/test_packaging.py` clears egg-info and
# `test_the_wheel_carries_nothing_the_repository_does_not` guards the result. See ADR-0058.
[tool.setuptools.exclude-package-data]
cobol_modernizer = [
    "data/templates/**/target/**",
]

[tool.ruff]
line-length = 100

# Before this block pytest resolved a `rootdir` and reported **no `configfile` at all** -- every
# setting was a default, and the only registered markers were the two `conftest.py` adds at runtime
# via `addinivalue_line`. That registration stays where it is: it carries the reasoning for each
# marker, which a bare list here could not.
#
# `--strict-markers` turns a *misspelled* marker into a collection error rather than a silently
# unmarked test. It does not catch a *missing* marker -- a test with no marker at all is still
# collected and still counted in "passed" -- which is why the tier split is a separate change with
# a directory-derived marker hook, not something this line can substitute for.
#
# Both flags were verified to pass before being set here, rather than committed and left to CI:
# `pytest --collect-only --strict-markers --strict-config` exits 0 over all 1208 tests.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

# **Not wired into CI, deliberately, and this is the honest state rather than an aspiration.**
# `mypy` over `src/` on default settings reports **18 errors in 6 of 53 modules**. Adding the tool
# without the gate is what makes that number visible and falsifiable; adding the gate now would mean
# either a red build or suppressions that hide what the tool just found.
#
# It was 20 in 8 before `types-PyYAML` was added above -- worth recording because the two that went
# away were not fixed, they were *unmasked*: an untyped `import yaml` makes every value read from it
# `Any`, and `Any` silences errors rather than reporting them. A stub package can just as easily
# raise the count as lower it.
#
# `py.typed` is deliberately absent for the same reason. The marker is a claim to a consumer --
# control-plane installs this wheel (ADR-0055) -- that these annotations are meaningful, and one of
# the 20 is a real defect rather than a narrowing nuisance: `data_loader.py` calls
# `.upper()` on `PicMapping.field_name` and compares it to the string `"FILLER"`, while
# `record_layout.py` sets that same field to `None` for exactly the FILLER case. Shipping the marker
# over that would be asserting something measured to be false.
#
# `strict = true` is not set: default settings found the 20 above, and the several hundred
# `disallow_untyped_defs` reports it would add are noise stacked on top of real findings.
[tool.mypy]
python_version = "3.12"
files = ["src/cobol_modernizer"]
