[project]
name = "cobol-modernizer"
version = "0.1.0"
description = "COBOL-to-Java modernization specialist, invoked as a CLI by agentic-sdlc-control-plane."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.9",
    "pydantic>=2.10.4",
    "anthropic>=0.40.0",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "pyyaml>=6.0.2",
]

[project.scripts]
cobol-modernizer = "cobol_modernizer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
    # Required by tests/system/test_packaging.py, which builds a real wheel. Listed here rather
    # than left to chance: that test skips when `build` is absent, and a guard that silently skips
    # is the decorative-check failure Open Issue 3 already cost this repo once.
    "build>=1.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The CLI's own data: prompt registry, model catalog/routing config, and the Spring Boot baseline
# copied into every generated project. Without this the wheel contains zero non-Python files and an
# installed `cobol-modernizer design` dies on a missing prompt (ADR-0055). It went unnoticed because
# CI installs with `pip install -e .`, where the package is still in the source tree.
#
# `schemas/` is deliberately absent: nothing in the runtime path reads it -- only
# `scripts/generate_schemas.py` and `tests/system/test_schemas.py` do.
[tool.setuptools.package-data]
cobol_modernizer = [
    "data/prompts/registry/**/*.md",
    "data/config/*.yaml",
    "data/templates/**/*",
]

[tool.ruff]
line-length = 100
