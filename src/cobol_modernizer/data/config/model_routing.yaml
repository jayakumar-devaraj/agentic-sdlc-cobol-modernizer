# Per-node, per-complexity-tier ROUTING POLICY (ADR-0004 -> ADR-0014 -> ADR-0015).
#
# Note what is NOT in this file: model names. A tier states the capability it needs and the shape
# of work it does; `core/model_routing.py` computes the cheapest catalogued model that clears that
# bar and is `verified_for` the node (config/model_catalog.yaml). Change a price or land a
# benchmark, and selection updates everywhere without editing fifteen entries by hand.
#
# typical_input_tokens / typical_output_tokens are MEASURED, from the live four-program run and the
# CBACT04C model benchmark (docs/qa/verification-report.md). They exist because ranking candidates
# by list price alone is wrong: output is ~70% of a spec_extractor call's cost and ~80% of a
# spec_critic call's, so a model with cheap input and dear output looks better than it is.
#
# max_output_tokens is a SAFETY CEILING, not a cost lever -- set above real observed output so
# nothing truncates (a truncated critic response is a hard SpecCritiqueParseError). The cost levers
# are the model the policy selects and `effort`.

spec_extractor:
  # Benchmarked on CBACT04C 2026-08-08, four models, six source-verified hard facts. Opus 5 alone
  # identified that `ELSE PERFORM 1050-UPDATE-ACCOUNT` is unreachable and the final account's
  # interest is therefore never posted; both Sonnets narrated that dead branch as live, and Haiku
  # additionally missed COMPUTE-without-ROUNDED truncation. All four scored fidelity_issues=0, so
  # the deterministic layer cannot separate them -- this is a capability bar the checks can't
  # enforce, which is why rank 4 is required rather than preferred.
  simple:
    min_capability_rank: 1
    effort: low
    max_output_tokens: 12000
    typical_input_tokens: 5000
    typical_output_tokens: 5500
  moderate:
    min_capability_rank: 3
    effort: medium
    max_output_tokens: 24000
    typical_input_tokens: 20000
    typical_output_tokens: 10000
  complex:
    min_capability_rank: 4
    effort: high
    max_output_tokens: 32000
    typical_input_tokens: 36000
    typical_output_tokens: 13000

# Benchmarked 2026-08-08 against a narration corrupted with three source-checkable errors the
# deterministic layer provably cannot see. Haiku caught all three (0.00/0.20/0.40) and Opus caught
# all three (0.30/0.15/0.35) at 2.3x the cost, so rank 1 is genuinely sufficient here and the
# selection function picks Haiku on cost. Opus stays eligible; it is simply never cheapest.
spec_critic:
  simple:
    min_capability_rank: 1
    effort: low
    max_output_tokens: 16000
    typical_input_tokens: 14000
    typical_output_tokens: 16000
  moderate:
    min_capability_rank: 1
    effort: medium
    max_output_tokens: 24000
    typical_input_tokens: 22000
    typical_output_tokens: 20000
  complex:
    min_capability_rank: 1
    effort: high
    max_output_tokens: 28000
    typical_input_tokens: 25000
    typical_output_tokens: 23000

# NOT BENCHMARKED. One call reasoning across every program at once (ADR-0010) and the only producer
# of `unified_design`, so it is pinned to the strongest verified model rather than selected on
# cost. `pinned_model` is deliberately noisy in review: it names the absence of evidence instead of
# letting a cost-ranked pick quietly stand in for one. Remove the pin once a benchmark exists.
solution_architect:
  simple:
    pinned_model: claude-opus-5
    pin_reason: "No benchmark yet for cross-program design quality; see ADR-0015."
    min_capability_rank: 4
    effort: medium
    max_output_tokens: 16000
    typical_input_tokens: 40000
    typical_output_tokens: 5000
  moderate:
    pinned_model: claude-opus-5
    pin_reason: "No benchmark yet for cross-program design quality; see ADR-0015."
    min_capability_rank: 4
    effort: high
    max_output_tokens: 24000
    typical_input_tokens: 55000
    typical_output_tokens: 5000
  complex:
    pinned_model: claude-opus-5
    pin_reason: "No benchmark yet for cross-program design quality; see ADR-0015."
    min_capability_rank: 4
    effort: high
    max_output_tokens: 32000
    typical_input_tokens: 60000
    typical_output_tokens: 5000

